# see documentation, e.g.
# - https://packaging.python.org/en/latest/specifications/declaring-project-metadata/#declaring-project-metadata
# - https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
# - https://www.python.org/dev/peps/pep-0621/

[build-system]
requires = ["setuptools>=64.0.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    { name = "Candace Makeda Moore", email = "doctormakeda@gmail.com" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]

dependencies = ["numpy","pandas","matplotlib","scipy",]
description = "This package contains methods for medical image segmentation."
keywords = ["segmentation"," MRI"," CT"," medical image"]
license = {file = "LICENSE"}
name = "dissector"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
version = "0.0.6"

[project.optional-dependencies]
dev = [
    "build",  # build is not only used in publishing (below), but also in the template's test suite
    "bump-my-version",
    "coverage [toml]",
    "pytest",
    "pytest-cov",
    "ruff",
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx-autoapi",
    "tox",
    "myst_parser",
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx-autoapi",
    "myst_parser",
]
publishing = [
    "build",
    "twine",
    "wheel",
]

[project.urls]
Repository = "https://github.com/drcandacemakedamoore/dissector"
Issues = "https://github.com/drcandacemakedamoore/dissector/issues"
ReadTheDocs = "https://dissector.readthedocs.io"

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.coverage.run]
branch = true
source = ["src/dissector"]
command_line = "-m pytest"

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py38,py39,py310,py311,py312
skip_missing_interpreters = true
[testenv]
commands = pytest
extras = dev
"""

[tool.ruff]
line-length = 120
output-format = "concise"
#extend-exclude = ["docs"]
extend-exclude = ["docs", "*.ipynb"]

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
extend-per-file-ignores = { "**/*.ipynb" = ["ALL"] }


# Enable Pyflakes `E` and `F` codes by default.
select = ["ALL"]
ignore = [
    "ANN101", # Missing type annotation for `self` in method
    "ANN102", # Missing type annotation for `cls` in classmethod
    "ANN204", # Missing return type annotation for special (dunder) method
    "COM812",
    "FBT",    # Using boolean function arguments
    "TD",     # TODOs
    "FIX001", # Resolve FIXMEs
    "FIX002", # Resolve TODOs
    "B028",   # No explicit `stacklevel` keyword argument found in warning
    # No docstrings required in the following cases
    "D100", # Missing module docstring
    "D104", # Missing public package docstring
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]

# "**/*.ipynb" = ["ERA001"]
# Tests can ignore a few extra rules
"tests/**.py" = [
    "ANN201", # Missing return type annotation for public function
    "PT011",  # Missing `match` parameter in `pytest.raises()`
    "S101",   # Use of assert is detected
]
# medsegdiff/ is a standalone ML training tool, not part of the installable package.
# Standard ML script conventions apply: print for progress, os.path over pathlib,
# uppercase tensor-shape variables (B, D, H, W), common import aliases (sitk, TF, F).
"onzediff/**.py" = [
    "T201",    # print() is the intended progress output for CLI scripts
    "PTH103", "PTH110", "PTH111", "PTH112", "PTH118", "PTH123", "PTH207", "PTH208",
    "N806", "N803",   # uppercase tensor-shape vars (B, D, H, W) are standard in PyTorch
    "N812", "N813",   # sitk / TF / F are universal aliases in medical-imaging code
    "PLR0913",        # scientific functions legitimately need many parameters
    "PLR0915",        # training loops are necessarily long
    "S311",           # random is used for data augmentation, not cryptography
    "PLR2004",        # 0.5 flip probability is not a magic number
    "TRY003", "EM101", "EM102",  # exception message style — overkill for scripts
    "ANN001", "ANN201",          # type annotations present where it matters
]
"medsegdiff/**.py" = [
    "T201",    # print() is the intended progress output for CLI scripts
    "PTH103", "PTH110", "PTH111", "PTH112", "PTH118", "PTH123", "PTH207", "PTH208",
    "N806", "N803",   # uppercase tensor-shape vars (B, D, H, W) are standard in PyTorch
    "N812", "N813",   # sitk / TF / F are universal aliases in medical-imaging code
    "PLR0913",        # scientific functions legitimately need many parameters
    "PLR0915",        # training loops are necessarily long
    "S311",           # random is used for data augmentation, not cryptography
    "PLR2004",        # 0.5 flip probability is not a magic number
    "TRY003", "EM101", "EM102",  # exception message style — overkill for scripts
    "ANN001", "ANN201",          # type annotations present where it matters
]

[tool.ruff.lint.isort]
known-first-party = ["dissector"]
force-single-line = true
no-lines-before = ["future","standard-library","third-party","first-party","local-folder"]

[tool.bumpversion]
current_version = "0.0.6"

[[tool.bumpversion.files]]
filename = "src/dissector/__init__.py"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "CITATION.cff"

[[tool.bumpversion.files]]
filename = "docs/conf.py"
